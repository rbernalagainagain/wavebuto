<header #header>
  <span class="site-name">{{ 'app.siteName' | transloco }}</span>
  <nav [attr.aria-label]="'app.navLabel' | transloco">
    @for (section of sections; track section) {
      <a routerLink="/" [fragment]="section" skipLocationChange>{{
        'app.nav.' + section | transloco
      }}</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer>
  <span>{{ 'app.siteName' | transloco }}</span>
  <span>{{ year }}</span>
</footer>
