<!-- Hero. Inside <main>, so it is not the page's banner landmark. -->
<header>
  <!-- The space before the arrow lives inside its span, so formatting cannot drop it. -->
  <a routerLink="/" fragment="contact"
    ><ng-container i18n="@@intro.bookings">Bookings</ng-container
    ><span aria-hidden="true"> →</span></a
  >
  <h1>
    <img
      src="web/logo-wavebuto.svg"
      alt="Wavebuto"
      i18n-alt="@@intro.logo.alt"
      width="165"
      height="187"
    />
  </h1>
  <!-- Each frame of the design crops the photo its own way: the mobile crop by
       default, the desktop one from the breakpoint on. -->
  <picture>
    <source
      media="(min-width: 40rem)"
      srcset="web/intro-torso-wide.webp"
      width="2232"
      height="1364"
    />
    <img
      src="web/intro-torso.webp"
      alt="Black line tattoo across a torso"
      i18n-alt="@@intro.torso.alt"
      width="912"
      height="1684"
    />
  </picture>
</header>

<!-- Manifiesto. -->
<div>
  <img
    src="web/intro-face.webp"
    alt="Close-up of a face with black lines"
    i18n-alt="@@intro.face.alt"
    width="558"
    height="164"
    loading="lazy"
  />
  <!--
    What the eye reads: one run of capitals, cities in bold, and a <wbr> where
    each space was. Every word sits inside a tag (<b> or <ng-container>), so the
    whitespace of this template never reaches the run.
  -->
  <p aria-hidden="true">
    @for (piece of visual; track $index) {
      @switch (piece.kind) {
        @case ('break') {
          <wbr />
        }
        @case ('city') {
          <b>{{ piece.text }}</b>
        }
        @default {
          <ng-container>{{ piece.text }}</ng-container>
        }
      }
    }
  </p>
  <!-- What a screen reader reads. -->
  <p>{{ readable }}</p>
</div>
