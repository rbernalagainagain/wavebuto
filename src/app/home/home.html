<section id="home" aria-labelledby="home-title">
  <h1 id="home-title">{{ 'home.title' | transloco }}</h1>
  <p>{{ 'home.intro' | transloco }}</p>
  <p>{{ 'home.outro' | transloco }}</p>
</section>

<section id="gallery" aria-labelledby="gallery-title">
  <h2 id="gallery-title">{{ 'gallery.title' | transloco }}</h2>
  <ul>
    @for (image of galleryImages; track image.src) {
      <li>
        <img
          [src]="image.src"
          [alt]="image.altKey | transloco"
          [width]="image.width"
          [height]="image.height"
        />
      </li>
    }
  </ul>
</section>

<section id="contact" aria-labelledby="contact-title">
  <h2 id="contact-title">{{ 'contact.title' | transloco }}</h2>
  <app-contact-form />
</section>
