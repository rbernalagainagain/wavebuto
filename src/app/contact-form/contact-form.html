<form (submit)="onSubmit($event)" novalidate>
  <div class="field">
    <label for="name">Your name</label>
    <input
      id="name"
      name="name"
      type="text"
      #nameInput
      [value]="state().name.value"
      (input)="onInput('name', nameInput.value)"
      (blur)="onBlur('name')"
      [attr.aria-invalid]="showError('name') ? 'true' : null"
      [attr.aria-describedby]="showError('name') ? errorId('name') : null"
    />
    @if (showError('name')) {
      <p [id]="errorId('name')" role="alert">{{ state().name.error }}</p>
    }
  </div>

  <div class="field">
    <label for="email">Email address</label>
    <input
      id="email"
      name="email"
      type="email"
      #emailInput
      [value]="state().email.value"
      (input)="onInput('email', emailInput.value)"
      (blur)="onBlur('email')"
      [attr.aria-invalid]="showError('email') ? 'true' : null"
      [attr.aria-describedby]="showError('email') ? errorId('email') : null"
    />
    @if (showError('email')) {
      <p [id]="errorId('email')" role="alert">{{ state().email.error }}</p>
    }
  </div>

  <div class="field">
    <label for="subject">What's this about?</label>
    <select
      id="subject"
      name="subject"
      #subjectSelect
      [value]="state().subject.value"
      (change)="onInput('subject', subjectSelect.value)"
      (blur)="onBlur('subject')"
      [attr.aria-invalid]="showError('subject') ? 'true' : null"
      [attr.aria-describedby]="showError('subject') ? errorId('subject') : null"
    >
      <option value="">Choose one</option>
      @for (option of subjectOptions; track option) {
        <option [value]="option">{{ subjectLabels[option] }}</option>
      }
    </select>
    @if (showError('subject')) {
      <p [id]="errorId('subject')" role="alert">{{ state().subject.error }}</p>
    }
  </div>

  <div class="field">
    <label for="message">Message</label>
    <textarea
      id="message"
      name="message"
      #messageTextarea
      [value]="state().message.value"
      (input)="onInput('message', messageTextarea.value)"
      (blur)="onBlur('message')"
      [attr.aria-invalid]="showError('message') ? 'true' : null"
      [attr.aria-describedby]="showError('message') ? errorId('message') : null"
    ></textarea>
    @if (showError('message')) {
      <p [id]="errorId('message')" role="alert">{{ state().message.error }}</p>
    }
  </div>

  <button type="submit">Send</button>
</form>
